mqtt:
  host: "192.168.1.100"
  port: 1883
  username: "gateway"
  password: "changeme"
  topic_prefix: "factory/line1"
  qos: 1

devices:
  - name: "conveyor-plc"
    protocol: modbus_tcp
    host: "192.168.1.10"
    port: 502
    poll_interval_ms: 1000
    tags:
      - name: "motor_speed"
        register: 40001
        type: uint16
        scale: 0.1
      - name: "motor_running"
        register: 10001
        type: bool

  - name: "s7-1500-main"
    protocol: s7
    host: "192.168.1.20"
    rack: 0
    slot: 1
    poll_interval_ms: 500
    tags:
      - name: "temperature_zone1"
        db: 10
        db_offset: 0
        type: real
      - name: "pump_enabled"
        db: 10
        db_offset: 4
        bit: 0
        type: bool
